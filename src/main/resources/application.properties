spring.application.name=pool

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=poolingforlseg

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

logging.level.org.springframework.security=TRACE

jwt.secret=change-this-to-a-long-random-secret-key-for-development

mapbox.base-url =https://api.mapbox.com
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}