services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: "poolingforlseg"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8888:8080"
    restart: always

volumes:
  postgres_data: